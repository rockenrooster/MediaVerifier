name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      appendix:
        description: Also repeat the appendix A experiments with the engine and print the report (task FFB-05)
        type: boolean
        default: false
      benchmark:
        description: Also run the corruption benchmark with the bundle, then with the tooling build (subplan 17, Updating FFmpeg)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings are errors)
        run: dotnet build MediaVerifier.sln -c Release

      - name: Unit tests
        run: dotnet test MediaVerifier.sln -c Release --no-build --filter "Category!=Integration&Category!=System&Category!=Perf&Category!=Fuzz&Category!=Calibration"

      - name: Parser fuzz (60-second budget, task T-07)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $watch = [Diagnostics.Stopwatch]::StartNew()
          dotnet test MediaVerifier.sln -c Release --no-build --filter "Category=Fuzz"
          if ($LASTEXITCODE -ne 0) { throw 'Parser fuzz failed' }
          $seconds = [math]::Round($watch.Elapsed.TotalSeconds, 1)
          if ($seconds -gt 60) { throw "Parser fuzz took $seconds s; the budget is 60 s" }
          Write-Host "Parser fuzz passed in $seconds s"

      - name: Self-check
        shell: pwsh
        run: |
          # A GUI-subsystem exe neither blocks the pipeline nor sets $LASTEXITCODE.
          $exe = Join-Path $PWD 'src/MediaVerifier/bin/Release/net10.0-windows/win-x64/MediaVerifier.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--self-check' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Self-check failed with exit code $($process.ExitCode)" }
          Write-Host 'Self-check passed'

  # Subplan 15, Continuous integration: the integration and system tests against the bundled FFmpeg (or, until the
  # first bundle is published, the tooling build), with generated fixtures cached between runs.
  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The full build generates the test media (it has the encoders the bundle lacks). Pinned to the version the
      # plans and appendix A were verified with; change it together with the fixture cache key below.
      - name: Install the tooling FFmpeg
        shell: pwsh
        run: choco install ffmpeg-full --version 8.0.1 --no-progress -y

      - name: Cache the FFmpeg bundle
        if: hashFiles('deps/ffmpeg/bundle.lock.json') != ''
        uses: actions/cache@v4
        with:
          path: deps/ffmpeg/bin
          key: ffmpeg-bundle-${{ hashFiles('deps/ffmpeg/bundle.lock.json') }}

      - name: Fetch the FFmpeg bundle
        if: hashFiles('deps/ffmpeg/bundle.lock.json') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\Get-FfmpegBundle.ps1

      - name: Use the tooling FFmpeg until the first bundle exists
        if: hashFiles('deps/ffmpeg/bundle.lock.json') == ''
        shell: pwsh
        run: |
          # Point at the package's own binaries, not Chocolatey's shims, so the engine's job object owns the process.
          $probe = Get-ChildItem (Join-Path $env:ChocolateyInstall 'lib\ffmpeg-full') -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $probe) { throw 'ffprobe.exe was not found in the ffmpeg-full package' }
          "MEDIAVERIFIER_FFMPEG_DIR=$($probe.DirectoryName)" >> $env:GITHUB_ENV

      - name: Cache the generated fixtures
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/MediaVerifier.Fixtures
          key: fixtures-${{ hashFiles('tests/MediaVerifier.Tests/TestSupport/FixtureFactory.cs') }}-ffmpeg-full-8.0.1

      - name: Build (warnings are errors)
        run: dotnet build MediaVerifier.sln -c Release

      # Every test except the slow and separate categories: tests that need FFmpeg skip themselves in the
      # build job, and many fixture tests carry no category, so filtering on Integration would skip them.
      - name: Tests with FFmpeg
        shell: pwsh
        env:
          # Path.GetTempPath() follows TMP, so the fixtures land in the cached folder.
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          # Empty unless a manual run asks for the appendix A report (AppendixAMeasurements).
          MEDIAVERIFIER_APPENDIX_REPORT: ${{ inputs.appendix && format('{0}\appendix-a.md', runner.temp) || '' }}
        run: dotnet test MediaVerifier.sln -c Release --no-build --filter "Category!=Perf&Category!=Fuzz&Category!=Calibration"

      # Subplan 17, "Updating FFmpeg": the corruption benchmark with the bundle, then with the tooling build on the
      # same fixtures, so that a change in a detection rate can be told apart from a change in the fixtures.
      - name: Corruption benchmark, bundle and tooling build
        if: ${{ always() && inputs.benchmark }}
        timeout-minutes: 120
        shell: pwsh
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          $filter = 'FullyQualifiedName~CorruptionBenchmark'
          dotnet test MediaVerifier.sln -c Release --no-build --filter $filter --logger 'console;verbosity=detailed'
          $bundle = $LASTEXITCODE
          Rename-Item deps\ffmpeg\bin bin-bundle
          $probe = Get-ChildItem (Join-Path $env:ChocolateyInstall 'lib\ffmpeg-full') -Recurse -Filter ffprobe.exe | Select-Object -First 1
          $env:MEDIAVERIFIER_FFMPEG_DIR = $probe.DirectoryName
          dotnet test MediaVerifier.sln -c Release --no-build --filter $filter --logger 'console;verbosity=detailed'
          $tooling = $LASTEXITCODE
          Rename-Item deps\ffmpeg\bin-bundle bin
          Write-Host "Benchmark exit codes: bundle $bundle, tooling build $tooling"
          if ($bundle -ne 0) { exit 1 }

      - name: Appendix A report
        if: ${{ always() && inputs.appendix }}
        shell: pwsh
        run: |
          # The engine's report, then the tooling build's on the same fixtures (when its version differs).
          foreach ($name in 'appendix-a.md', 'appendix-a.tooling.md') {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $path) { Get-Content -Raw -Encoding utf8 $path }
          }

      - name: Keep the appendix A report
        if: ${{ always() && inputs.appendix }}
        uses: actions/upload-artifact@v4
        with:
          name: appendix-a-report
          path: ${{ runner.temp }}/appendix-a*.md
