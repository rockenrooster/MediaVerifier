<text x="721.424" y="328" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#00131F" dominant-baseline="central">Add folder</text>
<text x="740" y="372" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#B0B0B0" dominant-baseline="central" text-anchor="middle">or drop folders anywhere in this window</text>
<rect x="224.5" y="452.5" width="335" height="131" rx="8" fill="#2A2A2A" stroke="#454545" stroke-width="1"/>
<circle cx="252" cy="480" r="12" fill="#243C4D" stroke="#60CDFF" stroke-width="1"/>
<text x="252" y="480" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F5F5F5" dominant-baseline="central" text-anchor="middle">1</text>
<text x="276" y="480" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#F5F5F5" dominant-baseline="central">Add folders</text>
<text x="240" y="513.5" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#CECECE" dominant-baseline="central">Choose what to watch. Mark backup drives as</text>
<text x="240" y="532.5" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#CECECE" dominant-baseline="central">Backup so damaged files can be restored from them.</text>
<rect x="572.5" y="452.5" width="335" height="131" rx="8" fill="#2A2A2A" stroke="#454545" stroke-width="1"/>
<circle cx="600" cy="480" r="12" fill="#1F1F1F" stroke="#454545" stroke-width="1"/>
<text x="600" y="480" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F5F5F5" dominant-baseline="central" text-anchor="middle">2</text>
<text x="624" y="480" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#F5F5F5" dominant-baseline="central">Scan</text>
<text x="588" y="513.5" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#CECECE" dominant-baseline="central">A Standard scan decodes audio and photos fully and</text>
<text x="588" y="532.5" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#CECECE" dominant-baseline="central">samples video. You see the estimated time first.</text>
<rect x="920.5" y="452.5" width="335" height="131" rx="8" fill="#2A2A2A" stroke="#454545" stroke-width="1"/>
<circle cx="948" cy="480" r="12" fill="#1F1F1F" stroke="#454545" stroke-width="1"/>
<text x="948" y="480" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F5F5F5" dominant-baseline="central" text-anchor="middle">3</text>
<text x="972" y="480" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#F5F5F5" dominant-baseline="central">Stay protected</text>
<text x="936" y="513.5" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#CECECE" dominant-baseline="central">Create a schedule. Scans then run on their own and</text>
<text x="936" y="532.5" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#CECECE" dominant-baseline="central">you hear about new problems only.</text>
