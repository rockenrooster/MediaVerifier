<g transform="translate(716 148) scale(3)" fill="none" stroke="#B0B0B0" stroke-width="0.833333" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5 H6 L7.5 6 H14 V12.5 H2 Z"/><line x1="8" y1="7.75" x2="8" y2="10.75"/><line x1="6.5" y1="9.25" x2="9.5" y2="9.25"/></g>
<text x="740" y="228" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#F5F5F5" dominant-baseline="central" text-anchor="middle">Add a folder to start watching it</text>
<text x="740" y="260" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#CECECE" dominant-baseline="central" text-anchor="middle">MediaVerifier checks photos, videos and music for damage, silent changes and fake quality.</text>
<text x="740" y="280" font-family="Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#CECECE" dominant-baseline="central" text-anchor="middle">It only reads your files. Nothing is changed unless you ask.</text>
<rect x="685.5" y="312" width="109" height="32" rx="4" fill="#60CDFF"/>
<rect x="683.5" y="310" width="113" height="36" rx="7" fill="none" stroke="#60CDFF" stroke-width="2"/>
